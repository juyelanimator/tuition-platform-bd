<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · TuitionBD</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">Tuition<span>BD</span></a><a href="/">Public site ↗</a></header><main class="section"><div id="login" class="card" style="max-width:460px;margin:40px auto"><p class="eyebrow">CONTROL CENTER</p><h2>Admin login</h2><form id="loginForm"><input name="username" value="admin" placeholder="Username"><input name="password" type="password" placeholder="Password"><button>Sign in</button></form><p class="loading">Password is configured as a Cloudflare secret.</p></div><div id="dash" hidden><p class="eyebrow">OVERVIEW</p><h1>Admin dashboard</h1><div id="stats" class="grid"></div></div></main><script>const form=document.querySelector('#loginForm');form.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form));const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)return alert(d.error);localStorage.token=d.token;load()};async function load(){const r=await fetch('/api/admin/summary',{headers:{authorization:'Bearer '+localStorage.token}});if(!r.ok)return;const d=await r.json();login.hidden=true;dash.hidden=false;stats.innerHTML=Object.entries(d).map(([k,v])=>'<div class="card"><span class="eyebrow">'+k.toUpperCase()+'</span><h2>'+v+'</h2></div>').join('')}if(localStorage.token)load()</script></body></html>

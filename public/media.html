<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Agency · TuitionBD</title><link rel="stylesheet" href="/styles.css?v=3"><style>.panel{max-width:1200px;margin:auto;padding:30px 6% 80px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.stat{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:14px}.stat b{font-size:2rem;display:block;margin-top:10px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:850px}.form-grid input,.form-grid select,.form-grid textarea{width:100%;min-height:46px}.form-grid textarea{grid-column:1/-1}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:.85rem}th{color:var(--accent);font-size:.7rem}td{color:var(--muted)}.primary,.action{border:1px solid var(--line);border-radius:8px;padding:11px 15px;background:#1a2740;color:var(--text)}.primary{background:var(--accent);color:#111;border:0}@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><a class="brand" href="/">Tuition<span>BD</span></a><nav><a href="/">Public site ↗</a><a href="/admin.html">Admin panel</a><button id="logout">Logout</button></nav></header><main class="panel"><section id="login" class="card" style="max-width:460px;margin:40px auto"><p class="eyebrow">MEDIA AGENCY</p><h2>Agency login</h2><form id="loginForm"><input name="username" placeholder="Agency username"><input name="password" type="password" placeholder="Password"><button class="primary">Sign in</button></form></section><section id="app" hidden><p class="eyebrow">YOUR AGENCY WORKSPACE</p><h1>Media Agency Panel</h1><div id="stats" class="stats"></div><div class="card" style="margin-top:20px"><h2>Edit agency profile</h2><form id="profile" class="form-grid"><input name="name" placeholder="Agency name"><input name="whatsapp" placeholder="WhatsApp"><input name="logo_url" placeholder="Logo URL"><input name="facebook" placeholder="Facebook URL"><input name="telegram" placeholder="Telegram URL"><button class="primary">Save profile</button></form></div><div class="card" style="margin-top:20px"><h2>Create tuition post</h2><p class="notice">Your agency identity is automatically attached. Published posts remain active for 15 days.</p><form id="form" class="form-grid"><input name="code" placeholder="Tuition code" required><input name="class_level" placeholder="Class / level" required><input name="subjects" placeholder="Subjects comma separated" required><input name="city" placeholder="District / city"><input name="area" placeholder="Thana / area"><select name="tuition_type"><option>Home Tuition</option><option>Online Tuition</option><option>Hybrid</option><option>Group Tuition</option></select><input name="salary" type="number" placeholder="Salary"><input name="days_per_week" type="number" placeholder="Days/week"><input name="preferred_time" placeholder="Time"><input name="whatsapp" placeholder="Phone / WhatsApp"><textarea name="special_requirement" placeholder="Description / custom requirements"></textarea><button class="primary">Publish post</button></form></div><div class="table-wrap"><table><thead><tr><th>CODE</th><th>CLASS / SUBJECT</th><th>LOCATION</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const $=s=>document.querySelector(s),token=()=>localStorage.mediaToken,head=()=>({authorization:'Bearer '+token(),'content-type':'application/json'});async function api(p,o={}){const r=await fetch(p,{...o,headers:{...head(),...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const [s,t,p]=await Promise.all([api('/api/media/summary'),api('/api/media/tuitions'),api('/api/media/profile')]);Object.entries(p.item||{}).forEach(([k,v])=>{const el=profile.elements[k];if(el)el.value=v||''});stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="stat"><span class="eyebrow">${k.replaceAll('_',' ').toUpperCase()}</span><b>${v}</b></div>`).join('');rows.innerHTML=t.items.map(x=>`<tr><td><strong>${esc(x.code)}</strong></td><td>${esc(x.classes_json)}<br>${esc(x.subjects_json)}</td><td>${esc(x.area)}, ${esc(x.city)}</td><td>${esc(x.status)}</td><td><button class="action" onclick="removePost('${esc(x.code)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No posts yet</td></tr>'}async function removePost(c){if(confirm('Delete this post?')){await api('/api/media/tuitions/'+encodeURIComponent(c),{method:'DELETE'});load()}}loginForm.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({...Object.fromEntries(new FormData(loginForm)),role:'media'}),headers:{}});localStorage.mediaToken=d.token;login.hidden=true;app.hidden=false;load()}catch(e){alert(e.message)}};profile.onsubmit=async e=>{e.preventDefault();try{await api('/api/media/profile',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('Profile updated');load()}catch(e){alert(e.message)}};form.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.subjects=b.subjects.split(',').map(x=>x.trim());try{await api('/api/media/tuitions',{method:'POST',body:JSON.stringify(b)});e.target.reset();load()}catch(e){alert(e.message)}};logout.onclick=()=>{localStorage.removeItem('mediaToken');location.reload()};if(token()){login.hidden=true;app.hidden=false;load()}</script></body></html>

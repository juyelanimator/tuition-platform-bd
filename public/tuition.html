<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tuition opportunity details · Tuition Platform BD"><title>Tuition details · TuitionBD</title><link rel="stylesheet" href="/styles.css?v=3"></head><body><header class="top"><a class="brand" href="/">Tuition<span>BD</span></a><a href="/">← সব listings</a></header><main class="section"><div id="detail" class="detail"><p class="loading">Loading…</p></div></main><script>const detail=document.querySelector('#detail'),code=new URLSearchParams(location.search).get('code'),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=x=>x?'৳'+Number(x).toLocaleString('en-BD'):'Negotiable';
async function load(){if(!code){detail.innerHTML='<h2>Listing পাওয়া যায়নি</h2>';return}try{const r=await fetch('/api/tuitions/'+encodeURIComponent(code)),d=await r.json();if(!r.ok||!d.item){detail.innerHTML='<h2>Listing পাওয়া যায়নি</h2><p class="lead">এই tuition postটি expired, hidden অথবা remove করা হয়েছে।</p>';return}const t=d.item,msg=encodeURIComponent('Hello, I am interested in Tuition Code '+t.code+' for '+t.class_level+' '+t.subjects+'. I found this tuition on Tuition Platform BD.'),phone=esc(t.phone||t.whatsapp||''),wa=encodeURIComponent(t.whatsapp||t.phone||'');detail.innerHTML='<p class="eyebrow">TUITION DETAILS · '+esc(t.code)+'</p><h1>'+esc(t.class_level)+' · '+esc(t.subjects)+'</h1><p class="lead">'+esc(t.special_requirement||'No description provided.')+'</p><div class="card" style="max-width:760px"><div class="facts"><div>Location<b>📍 '+esc([t.area,t.district,t.division].filter(Boolean).join(', ')||'Bangladesh')+'</b></div><div>Type<b>🏠 '+esc(t.tuition_type)+'</b></div><div>Salary<b>💰 '+money(t.salary_min)+'/month</b></div><div>Schedule<b>📅 '+esc(t.days_per_week||'—')+' days · '+esc(t.time_text||'Flexible')+'</b></div></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:25px"><a class="view" href="tel:'+phone+'">📞 Call now</a><a class="view" target="_blank" rel="noopener" href="https://wa.me/'+esc(t.whatsapp||t.phone||'')+'?text='+msg+'">💬 WhatsApp</a></div></div><p class="eyebrow" style="margin-top:50px">REPORT THIS LISTING</p><form id="report"><input name="reason" maxlength="200" placeholder="Reason (e.g. wrong information)" required><button>Report</button></form>'}catch(e){detail.innerHTML='<h2>Something went wrong</h2><p class="lead">Please try again later.</p>'}}
document.addEventListener('submit',async e=>{if(e.target.id!=='report')return;e.preventDefault();const r=await fetch('/api/tuitions/'+encodeURIComponent(code)+'/reports',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert(r.ok?'Report submitted. Thank you.':'Could not submit report.');if(r.ok)e.target.reset()});load();</script></body></html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tuition opportunity details · Tuition Platform BD"><title>Tuition details · TuitionBD</title><link rel="stylesheet" href="/styles.css?v=4"><style>.detail-wrap{max-width:900px;margin:auto;padding:28px 5% 100px}.contact-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.share-btn{cursor:pointer;border:1px solid var(--line);background:#182238;color:var(--text);border-radius:9px;padding:11px 15px}.related{margin-top:45px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.mini-grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><a class="brand" href="/">Tuition<span>BD</span></a><nav><a href="/">← সব listings</a><button id="lang">বাংলা / EN</button></nav></header><main class="detail-wrap"><div id="detail"><p class="loading">Loading…</p></div><section id="related" class="related"></section></main><script>
const detail=document.querySelector('#detail'),related=document.querySelector('#related'),code=new URLSearchParams(location.search).get('code'),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=x=>x?'৳'+Number(x).toLocaleString('en-BD'):'Negotiable',salaryText=t=>t.salary_max?money(t.salary_min)+'–'+money(t.salary_max):money(t.salary_min);
async function load(){if(!code){detail.innerHTML='<h2>Listing পাওয়া যায়নি</h2>';return}try{const r=await fetch('/api/tuitions/'+encodeURIComponent(code)),d=await r.json();if(!r.ok||!d.item){detail.innerHTML='<h2>Listing পাওয়া যায়নি</h2><p class="lead">এই tuition postটি expired, hidden অথবা remove করা হয়েছে।</p>';return}const t=d.item,msg=encodeURIComponent('Hello, I am interested in Tuition Code '+t.code+' for '+t.class_level+' '+t.subjects+'. I found this tuition on Tuition Platform BD.'),phone=esc(t.phone||t.whatsapp||''),wa=esc(t.whatsapp||t.phone||'');detail.innerHTML=`<p class="eyebrow">TUITION DETAILS · ${esc(t.code)}</p><h1>${esc(t.class_level)} · ${esc(t.subjects)}</h1>${t.media_name?`<p class="agency">🏢 ${esc(t.media_name)} ${t.logo_url?`<img class="media-logo" src="${esc(t.logo_url)}" alt="">`:''}</p>`:'<p class="platform">Platform listing</p>'}<p class="lead">${esc(t.special_requirement||'No description provided.')}</p><div class="card"><div class="facts"><div>Location<b>📍 ${esc([t.area,t.thana,t.district,t.division].filter(Boolean).join(', ')||'Bangladesh')}</b></div><div>Landmark<b>${esc(t.landmark||'Not specified')}</b></div><div>Type<b>🏠 ${esc(t.tuition_type)}</b></div><div>Salary<b>💰 ${salaryText(t)} / ${esc(t.salary_unit||'month')}</b></div><div>Schedule<b>📅 ${esc(t.days_per_week||'—')} days · ${esc(t.time_text||'Flexible')}</b></div><div>Student gender<b>${esc(t.student_gender||'Any')}</b></div></div>${t.commission_amount?`<p class="commission">Commission: ${esc(t.commission_type||'')} ${money(t.commission_amount)}</p>`:''}<div class="contact-actions"><a class="view" href="tel:${phone}">📞 Call now</a><a class="view" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">💬 WhatsApp</a><button class="share-btn" id="share">↗ Share</button><button class="share-btn" id="copy">▣ Copy code</button></div></div><p class="eyebrow" style="margin-top:45px">REPORT THIS LISTING</p><form id="report" class="form-grid"><select name="reason" required><option value="">Choose reason</option><option>Wrong information</option><option>Fake tuition</option><option>Wrong location</option><option>Wrong salary</option><option>Duplicate</option><option>Contact issue</option><option>Other</option></select><textarea name="details" placeholder="Additional details (optional)"></textarea><button>Report listing</button></form>`;share.onclick=async()=>{try{await navigator.share({title:'Tuition '+t.code,text:t.class_level+' · '+t.subjects,url:location.href})}catch{await navigator.clipboard?.writeText(location.href);alert('Link copied')}};copy.onclick=async()=>{await navigator.clipboard?.writeText(t.code);alert('Tuition code copied')};const rel=await fetch('/api/tuitions?subject='+encodeURIComponent(t.subjects.split(',')[0]||'')).then(x=>x.json());related.innerHTML='<p class="eyebrow">YOU MAY ALSO LIKE</p><div class="mini-grid">'+(rel.items||[]).filter(x=>x.code!==t.code).slice(0,3).map(x=>`<a class="card" href="/tuition?code=${encodeURIComponent(x.code)}"><strong>${esc(x.code)}</strong><br>${esc(x.class_level)} · ${esc(x.subjects)}<br>📍 ${esc(x.area||x.district||'Bangladesh')}</a>`).join('')+'</div>'}catch(e){detail.innerHTML='<h2>Something went wrong</h2><p class="lead">Please try again later.</p>'}}
document.addEventListener('submit',async e=>{if(e.target.id!=='report')return;e.preventDefault();const r=await fetch('/api/tuitions/'+encodeURIComponent(code)+'/reports',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert(r.ok?'Report submitted. Thank you.':'Could not submit report.');if(r.ok)e.target.reset()});load();</script></body></html>

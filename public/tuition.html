<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuition details · TuitionBD</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">Tuition<span>BD</span></a><a href="/">← সব listings</a></header><main class="section"><div id="detail" class="detail"><p class="loading">Loading…</p></div></main><script>const code=new URLSearchParams(location.search).get('code');const money=x=>x?'৳'+Number(x).toLocaleString('en-BD'):'Negotiable';fetch('/api/tuitions/'+encodeURIComponent(code)).then(r=>r.json()).then(({item:t,error})=>{if(error)return detail.innerHTML='<h2>Listing পাওয়া যায়নি</h2>';const msg=encodeURIComponent('Hello, I am interested in Tuition Code '+t.code+' for '+t.class_level+' '+t.subjects+'. I found this tuition on Tuition Platform BD.');detail.innerHTML='<p class="eyebrow">TUITION DETAILS · '+t.code+'</p><h1>'+t.class_level+' · '+t.subjects+'</h1><p class="lead">'+(t.description||'No description provided.')+'</p><div class="card" style="max-width:760px"><div class="facts"><div>Location<b>📍 '+[t.area,t.thana,t.district].filter(Boolean).join(', ')+'</b></div><div>Type<b>🏠 '+t.tuition_type+'</b></div><div>Salary<b>💰 '+(t.salary_type==='range'?money(t.salary_min)+'–'+money(t.salary_max):money(t.salary_min))+'/'+(t.salary_unit||'month')+'</b></div><div>Schedule<b>📅 '+(t.days_per_week||'—')+' days · '+(t.time_text||'Flexible')+'</b></div></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:25px"><a class="view" href="tel:'+t.phone+'">📞 Call now</a><a class="view" target="_blank" href="https://wa.me/'+(t.whatsapp||t.phone)+'?text='+msg+'">💬 WhatsApp</a></div></div><p class="eyebrow" style="margin-top:50px">REPORT THIS LISTING</p><form id="report"><input name="reason" placeholder="Reason (e.g. wrong information)" required><button>Report</button></form></div>}).catch(()=>detail.innerHTML='<h2>Something went wrong</h2>');const detail=document.querySelector('#detail');document.addEventListener('submit',async e=>{if(e.target.id!=='report')return;e.preventDefault();const r=await fetch('/api/tuitions/'+code+'/reports',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert(r.ok?'Report submitted. Thank you.':'Could not submit report.');});</script></body></html>

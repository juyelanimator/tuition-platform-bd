name = "tuition-platform-bd"
main = "src/index.js"
compatibility_date = "2026-09-26"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tuition-platform-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_NAME = "Tuition Platform BD"
SESSION_TTL_HOURS = "24"
